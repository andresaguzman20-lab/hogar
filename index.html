<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Gestor del Hogar</title>
<meta name="theme-color" content="#2459d6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  :root{
    --bg:#f2f4f8; --card:#fff; --txt:#1d2433; --sub:#6b7489; --linea:#e4e8ef;
    --pri:#2459d6; --pri2:#e8eefc; --ok:#1f9d55; --ok2:#e6f6ed; --mal:#d64545; --mal2:#fdecec; --warn:#c77c02; --warn2:#fff4e0; --gris2:#eef0f4;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f131a; --card:#1a202b; --txt:#e8ecf3; --sub:#97a0b3; --linea:#2a3240;
      --pri:#6d95ff; --pri2:#1f2a44; --ok:#4cc985; --ok2:#173326; --mal:#ff7a7a; --mal2:#3a1e22; --warn:#f0b04a; --warn2:#3a2e17; --gris2:#252c38; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
  header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--linea)}
  .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;max-width:900px;margin:0 auto}
  .top h1{font-size:17px;margin:0}
  .top .seccion{font-size:13px;color:var(--sub);margin-top:2px}
  .top small{color:var(--sub)}
  main{padding:14px 16px 100px;max-width:900px;margin:0 auto}

  .barra-inf{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--linea);
    display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .barra-inf button{border:0;background:transparent;color:var(--sub);font-size:12px;padding:6px 0;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .barra-inf button .ic{font-size:20px;line-height:1}
  .barra-inf button.on{color:var(--pri);font-weight:600}
  .barra-inf button.mas .ic{background:var(--pri);color:#fff;width:40px;height:30px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}

  .grid2{display:grid;grid-template-columns:1fr;gap:10px}
  @media (min-width:700px){ .grid2{grid-template-columns:1fr 1fr} }
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .tile{background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:16px 14px;text-align:left;cursor:pointer;color:var(--txt);min-height:104px;display:flex;flex-direction:column;gap:6px;font:inherit}
  .tile .ic{font-size:26px}
  .tile b{font-size:15px}
  .tile span{font-size:12px;color:var(--sub)}
  .card{background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:15px}
  .titulo{font-size:15px;font-weight:700;margin:18px 2px 10px;display:flex;align-items:center;gap:8px}
  .blk{background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:14px}
  .blk.ok{border-left:4px solid var(--ok)} .blk.pend{border-left:4px solid var(--warn)} .blk.mal{border-left:4px solid var(--mal)} .blk.gris{border-left:4px solid var(--linea);opacity:.8}
  .blk-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .blk-top .n{font-weight:700;font-size:15px}
  .blk-top .m{text-align:right;white-space:nowrap;font-weight:700;font-size:16px}
  .blk-acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:6px;margin-top:12px}
  .blk-acc .btn{width:100%;padding:9px 6px;font-size:13px}
  .mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .mini-grid div{background:var(--bg);border-radius:10px;padding:8px}
  .mini-grid span{display:block;font-size:11px;color:var(--sub)}
  .mini-grid b{font-size:14px}

  .mesbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;background:var(--card);border:1px solid var(--linea);border-radius:14px;padding:6px}
  .mesbar b{font-size:16px;text-transform:capitalize}
  .btn{border:0;background:var(--pri);color:#fff;padding:11px 14px;border-radius:12px;font-size:15px;cursor:pointer}
  .btn.sec{background:var(--pri2);color:var(--pri)}
  .btn.peligro{background:var(--mal2);color:var(--mal)}
  .btn.gris{background:var(--gris2);color:var(--sub)}
  .btn.full{width:100%}
  .btn:disabled{opacity:.5}
  .icono{border:0;background:var(--pri2);color:var(--pri);width:40px;height:40px;border-radius:10px;font-size:20px;cursor:pointer}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (min-width:700px){ .kpis{grid-template-columns:repeat(4,1fr)} }
  .kpi{background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:12px}
  .kpi span{display:block;color:var(--sub);font-size:12px}
  .kpi b{display:block;font-size:17px;margin-top:4px;word-break:break-word}
  .kpi i{display:block;font-style:normal;font-size:12px;color:var(--sub);margin-top:4px}
  .kpi.destacado{grid-column:1/-1}
  .pos{color:var(--ok)} .neg{color:var(--mal)}
  .fila{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--linea)}
  .fila:last-child{border-bottom:0}
  .t{font-weight:600}
  .s{color:var(--sub);font-size:13px}
  .der{text-align:right;white-space:nowrap}
  .chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--pri2);color:var(--pri);margin-top:6px}
  .chip.ok{background:var(--ok2);color:var(--ok)} .chip.pend{background:var(--warn2);color:var(--warn)} .chip.mal{background:var(--mal2);color:var(--mal)} .chip.gris{background:var(--gris2);color:var(--sub)}
  .estim{font-size:11px;color:var(--warn);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  .barra{height:6px;background:var(--linea);border-radius:4px;overflow:hidden;margin-top:10px}
  .barra div{height:100%;background:var(--pri)}
  label{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
  input,select,textarea{width:100%;padding:11px;border:1px solid var(--linea);border-radius:12px;background:var(--bg);color:var(--txt);font-size:16px}
  .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:6px}
  .opciones button{border:1px solid var(--linea);background:var(--card);color:var(--txt);padding:12px 8px;border-radius:12px;font-size:14px;cursor:pointer}
  .opciones button.on{border-color:var(--pri);background:var(--pri2);color:var(--pri);font-weight:600}
  .nota{font-size:13px;color:var(--sub);background:var(--pri2);border-radius:12px;padding:10px;margin-top:10px}
  .ecuacion .fila{padding:8px 0}
  .ecuacion .total{border-top:2px solid var(--linea);font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 6px;border-bottom:1px solid var(--linea);text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  .vacio{color:var(--sub);text-align:center;padding:16px 8px}
  .det{margin-top:10px;padding:8px 10px;background:var(--bg);border-radius:10px;font-size:13px}
  .det div{display:flex;justify-content:space-between;gap:8px;padding:3px 0}
  #toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:20;max-width:90%}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:15}
  #modal .hoja{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px 24px;max-height:90vh;overflow:auto}
  .cargando{color:var(--sub);text-align:center;padding:30px 0}
  .error{background:var(--mal2);color:var(--mal);padding:14px;border-radius:12px}
  .checks label{display:flex;align-items:center;gap:10px;color:var(--txt);font-size:15px;margin:10px 0;background:var(--bg);padding:12px;border-radius:12px}
  .checks input{width:20px;height:20px}
  .mrow{border:1px solid var(--linea);border-radius:12px;padding:4px 10px 10px;margin-top:10px}
  .login{max-width:380px;margin:8vh auto 0;text-align:center}
  .login img{width:96px;height:96px;border-radius:22px}
  .login h2{margin:16px 0 6px}
  #gbtn{display:flex;justify-content:center;margin:22px 0 10px;min-height:44px}
</style>
</head>
<body>
<header>
  <div class="top"><div><h1 id="hogar">Gestor del Hogar</h1><div class="seccion" id="seccion"></div></div><div style="text-align:right"><span id="estado" class="chip pend" style="display:none;margin:0 0 2px"></span><br><small id="quien"></small></div></div>
</header>
<main id="app"><div class="cargando">Cargando…</div></main>
<nav class="barra-inf">
  <button id="bInicio" onclick="ir('inicio')"><span class="ic">⌂</span>Inicio</button>
  <button id="bCargar" class="mas" onclick="ir('cargar')"><span class="ic">＋</span>Cargar</button>
  <button id="bMenu" onclick="ir('menu')"><span class="ic">☰</span>Menú</button>
</nav>
<div id="modal"><div class="hoja" id="modalHoja"></div></div>
<div id="toast"></div>

<script>
const S = { ini:null, tab:'inicio', periodo:null, tipoCarga:'gasto', verTerminadas:false, items:[], movs:[], ings:[], compras:[] };
const SECCIONES = {
  apagar:['🧾','A pagar','Vencimientos y pagos del mes'],
  acobrar:['💰','Ingresos esperados','Sueldos y cobros del mes'],
  movimientos:['📋','Movimientos','Gastos e ingresos del mes'],
  fijos:['🔁','Gastos fijos','Alquiler, servicios, débitos'],
  tarjetas:['💳','Tarjetas','Resúmenes y compras en cuotas'],
  creditos:['🏦','Créditos','Cuotas, saldo e interés'],
  cuentas:['👛','Cuentas','Saldos y movimientos'],
  flujo:['📈','Flujo de fondos','Próximos 12 meses'],
  usuarios:['👥','Usuarios','Quién entra y qué ve'],
  config:['⚙️','Configuración','Dólar, categorías, avisos']
};
const PERMISO_SECCION = { apagar:'inicio', acobrar:'ingresos' };
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const TIPO_TXT = {Tarjeta:'Resumen de tarjeta', Credito:'Crédito', Fijo:'Gasto fijo', Gasto:'Gasto a pagar', Ingreso:'Ingreso'};

// ---------- utilidades ----------
async function api(fn, ...args){
  let r;
  try{
    r = await fetch(window.CONFIG.API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ fn: fn, args: args, ses: S.ses || '' }), redirect:'follow' });
  }catch(e){
    if(navigator.onLine === false) throw new Error('Sin conexión. Revisá internet e intentá de nuevo.');
    if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(String(window.CONFIG.API_URL)))
      throw new Error('La URL del motor en config.js no es correcta: tiene que empezar con https://script.google.com/macros/s/ y terminar en /exec.');
    throw new Error('No se pudo conectar con el motor (Apps Script). Revisá que la implementación esté como "Ejecutar como: Yo" y "Quién tiene acceso: Cualquier persona", y que sea una versión nueva.');
  }
  let j;
  try{ j = await r.json(); }
  catch(e){ throw new Error('El motor no respondió bien (' + r.status + '). Revisá que la implementación de Apps Script tenga acceso "Cualquier persona".'); }
  if(!j.ok){
    if(j.error === 'SESION'){ salirLocal(); mostrarLogin('Tu sesión venció. Ingresá de nuevo.'); }
    throw new Error(j.error === 'SESION' ? 'Ingresá de nuevo.' : j.error);
  }
  return j.data;
}
const $ = id => document.getElementById(id);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function js(o){ return esc(JSON.stringify(o)); }
function numF(v){
  if(typeof v === 'number') return v;
  let t = String(v ?? '').trim().replace(/[^\d.,-]/g, '');
  if(!t) return 0;
  if(t.indexOf(',') >= 0) t = t.replace(/\./g, '').replace(',', '.');
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const n = Number(t); return isNaN(n) ? 0 : n;
}
/** 1234567.5 → "1.234.567,5" */
function fmtNum(n){
  if(n === '' || n === null || n === undefined || isNaN(Number(n))) return '';
  n = Math.round(Number(n) * 100) / 100;
  const neg = n < 0, abs = Math.abs(n);
  const [ent, dec] = String(abs).split('.');
  return (neg ? '-' : '') + ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (dec ? ',' + dec : '');
}
function setNum(el, n){ if(el) el.value = (n === '' || n === null) ? '' : fmtNum(n); }
/** Da formato mientras se escribe: puntos de miles automáticos y coma para decimales (máx. 2). */
function formatearMientrasEscribe(el, tecla){
  let v = el.value; if(v === '') return;
  let pos = el.selectionStart == null ? v.length : el.selectionStart;
  // un "." tipeado cuando todavía no hay coma se toma como coma decimal
  if(tecla === '.' && v.indexOf(',') < 0 && pos > 0 && v[pos-1] === '.'){ v = v.slice(0, pos-1) + ',' + v.slice(pos); }
  const neg = /^\s*-/.test(v);
  const antes = v.slice(0, pos).replace(/[^\d,]/g, '').length;
  let s = v.replace(/[^\d,]/g, '');
  const ic = s.indexOf(',');
  let ent = ic >= 0 ? s.slice(0, ic) : s;
  const dec = ic >= 0 ? s.slice(ic + 1).replace(/,/g, '').slice(0, 2) : null;
  ent = ent.replace(/^0+(?=\d)/, '');
  if(ent === '' && dec !== null) ent = '0';
  const nuevo = (neg ? '-' : '') + ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (dec !== null ? ',' + dec : '');
  el.value = nuevo;
  let c = 0, p = neg ? 1 : 0;
  while(p < nuevo.length && c < antes){ if(/[\d,]/.test(nuevo[p])) c++; p++; }
  try{ if(document.activeElement === el) el.setSelectionRange(p, p); }catch(e){}
}
document.addEventListener('input', e => {
  const el = e.target;
  if(el && el.tagName === 'INPUT' && el.getAttribute('inputmode') === 'decimal') formatearMientrasEscribe(el, e.data);
}, true);
// Los montos que se muestran en formularios (vienen como 1234.5) se pasan a formato argentino una sola vez
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => {
  if(!n.querySelectorAll) return;
  const ins = (n.matches && n.matches('input[inputmode=decimal]')) ? [n] : n.querySelectorAll('input[inputmode=decimal]');
  ins.forEach(i => { if(i.dataset.fmt) return; i.dataset.fmt = '1'; if(/^-?\d+(\.\d+)?$/.test(i.value)) i.value = fmtNum(i.value); });
}))).observe(document.documentElement, { childList: true, subtree: true });
function plata(n, mon){ n = Number(n)||0; return (mon==='USD'?'US$ ':'$ ') + n.toLocaleString('es-AR',{maximumFractionDigits: mon==='USD'?2:0}); }
function dos(o){ if(!o) return '—'; const p=[]; if(o.ARS||!o.USD) p.push(plata(o.ARS,'ARS')); if(o.USD) p.push(plata(o.USD,'USD')); return p.join('<br>'); }
function linea(o){ return dos(o).replace('<br>',' + '); }
function hay(o){ return !!o && ((o.ARS||0) > 0 || (o.USD||0) > 0); }
function equiv(o){ if(!o) return 0; return (Number(o.ARS)||0) + (Number(o.USD)||0) * (S.ini.cotizacion||0); }
function sumarMeses(p,n){ let y=+p.slice(0,4), m=+p.slice(5,7)+n; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return y+'-'+String(m).padStart(2,'0'); }
function nombreMes(p){ return MESES[+p.slice(5,7)-1] + ' ' + p.slice(0,4); }
function corto(p){ return MESES[+p.slice(5,7)-1].slice(0,3) + '-' + p.slice(2,4); }
function fechaCorta(f){ return f ? String(f).slice(8,10)+'/'+String(f).slice(5,7) : ''; }
function toast(t){ const e=$('toast'); e.textContent=t; e.style.display='block'; clearTimeout(e._t); e._t=setTimeout(()=>e.style.display='none',3500); }
function errorMsg(e){ return (e && e.message) ? e.message : String(e); }
function abrirModal(html){ $('modalHoja').innerHTML=html; $('modal').style.display='flex'; $('modalHoja').scrollTop=0; }
function cerrarModal(){ $('modal').style.display='none'; }
$('modal').addEventListener('click', e => { if(e.target.id==='modal') cerrarModal(); });
function puede(m){ return S.ini.usuario.permisos.indexOf(m) >= 0; }
function opciones(arr, sel){ return arr.map(x => `<option ${x===sel?'selected':''}>${esc(x)}</option>`).join(''); }
function opcCuentas(moneda, sel, conVacio){
  const cs = (S.ini.cuentas||[]).filter(c => !moneda || c.moneda === moneda);
  return (conVacio ? `<option value="">— No asociar a una cuenta —</option>` : '') +
    cs.map(c => `<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nombre)} · ${esc(c.titular)} (${c.moneda})</option>`).join('');
}
function opcTarjetas(sel){ return S.ini.tarjetas.length ? S.ini.tarjetas.map(t=>`<option value="${t.id}" ${t.id===sel?'selected':''}>${esc(t.nombre)}</option>`).join('') : '<option value="">Primero cargá una tarjeta</option>'; }
function cuentaDefault(moneda, preferida){
  const cs = (S.ini.cuentas||[]).filter(c => c.moneda === moneda);
  if(preferida && cs.some(c => c.id === preferida)) return preferida;
  const mia = cs.find(c => c.titular === S.ini.usuario.nombre);
  return (mia || cs[0] || {}).id || '';
}
function hayCuentas(){ return (S.ini.cuentas||[]).length > 0; }
function botonesModal(idOk, txt){ return `<div class="dos" style="margin-top:16px"><button class="btn gris" onclick="cerrarModal()">Cancelar</button><button class="btn" id="${idOk}">${txt||'Guardar'}</button></div>`; }
function textoInteres(x, mon){
  if(!x) return '';
  return `Interés ${plata(x.interes,mon)} (${x.pct}% sobre ${plata(x.capital,mon)})` + (x.tem ? ` · tasa ≈ ${x.tem}% mensual, ${x.tea}% anual efectiva` : '');
}
function fallo(e){ $('app').innerHTML = `<div class="error">${esc(errorMsg(e))}</div>`; }

// ---------- navegación ----------
function claveLocal(){ return 'gh_pq_' + (S.email || ''); }
async function iniciar(){
  try{ S.ses = localStorage.getItem('gh_ses') || ''; S.email = localStorage.getItem('gh_email') || ''; }catch(e){}
  if(!S.ses){ mostrarLogin(); return; }
  S.periodo = hoyCliente().slice(0,7);
  let local = null;
  try{ local = JSON.parse(localStorage.getItem(claveLocal()) || 'null'); }catch(e){}
  if(local && local.ini){
    aplicarPaquete(local, true);
    estado('Actualizando…');
    arrancarVista();
  }
  try{
    const pq = await api('paquete', S.periodo);
    aplicarPaquete(pq);
    estado('');
    if(!local) arrancarVista(); else ir(S.tab, true);
  }catch(e){
    estado('');
    if(!S.ses) return; // ya se mostró el ingreso
    if(/no tiene acceso/i.test(errorMsg(e))){ salirLocal(); mostrarLogin(errorMsg(e)); return; }
    if(!local) fallo(e); else toast('Sin conexión: mostrando lo último guardado');
  }
}

// ---------- ingreso con Google ----------
function mostrarLogin(msg){
  document.querySelector('.barra-inf').style.display = 'none';
  $('hogar').textContent = 'Gestor del Hogar'; $('quien').textContent = ''; $('seccion').textContent = '';
  $('app').innerHTML = `<div class="login card"><img src="icons/icon-192.png" alt="">
    <h2>Gestor del Hogar</h2><div class="s">Ingresá con tu cuenta de Google. Solo pueden entrar las cuentas dadas de alta.</div>
    <div id="gbtn"><span class="s">Cargando…</span></div>
    ${msg ? `<div class="error" style="margin-top:8px">${esc(msg)}</div>` : ''}
    ${S.instalar ? `<button class="btn sec full" style="margin-top:12px" onclick="instalarApp()">📲 Instalar la app</button>` : ''}</div>`;
  prepararBotonGoogle();
}
function prepararBotonGoogle(intentos){
  intentos = intentos || 0;
  if(!(window.google && google.accounts && google.accounts.id)){
    if(intentos > 50){ $('gbtn').innerHTML = '<span class="s">No se pudo cargar el ingreso de Google. Revisá la conexión.</span>'; return; }
    setTimeout(() => prepararBotonGoogle(intentos + 1), 200); return;
  }
  if(String(window.CONFIG.GOOGLE_CLIENT_ID).indexOf('PEGAR_ACA') >= 0){ $('gbtn').innerHTML = '<span class="error">Falta completar config.js</span>'; return; }
  google.accounts.id.initialize({ client_id: window.CONFIG.GOOGLE_CLIENT_ID, callback: alIngresarGoogle, ux_mode: 'popup', use_fedcm_for_prompt: true });

}
async function alIngresarGoogle(resp){

window.addEventListener('appinstalled', () => { S.instalar = null; toast('App instalada'); });

if('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

function arrancarVista(){

  $('quien').textContent = S.ini.usuario.nombre;

function hoyCliente(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function aplicarPaquete(pq, desdeLocal){
  S.data = pq; S.ini = pq.ini;
  S.meses = Object.assign({}, pq.meses);
  if(!desdeLocal){ try{ localStorage.setItem(claveLocal(), JSON.stringify(pq)); }catch(e){} prefetch(); }
}
async function datosMes(p){
  if(S.meses[p]) return S.meses[p];
  estado('Cargando…');
  try{ Object.assign(S.meses, await api('vistaMeses', [p])); } finally { estado(''); }
  return S.meses[p];
}
function prefetch(){
  const ps = [sumarMeses(S.periodo,-1), sumarMeses(S.periodo,1)].filter(p => !S.meses[p]);
  if(ps.length) api('vistaMeses', ps).then(r => Object.assign(S.meses, r)).catch(()=>{});
}
/** Ejecuta una acción en el servidor y recibe los datos actualizados en el mismo viaje. */
async function accion(fn, args){
  estado('Guardando…');
  try{
    const r = await api('ejecutar', fn, args, S.periodo);
    aplicarPaquete(r.paquete);
    return r.res;
  } finally { estado(''); }
}
async function recargar(){
  try{ await accion('recargar', []); toast('Datos actualizados'); ir(S.tab, true); }catch(e){ toast(errorMsg(e)); }
}
function estado(t){ $('estado').textContent = t; $('estado').style.display = t ? 'inline-block' : 'none'; }
function ocupar(b){ if(!b) return; b.disabled = true; b.dataset.txt = b.dataset.txt || b.textContent; b.textContent = 'Guardando…'; }
function liberar(b){ if(!b) return; b.disabled = false; if(b.dataset.txt) b.textContent = b.dataset.txt; }
function ir(tab, sinScroll){

  $('bInicio').classList.toggle('on', tab==='inicio');

function barraMes(fn){

    const s = r.siguiente;
    h += `<div class="card" style="margin:0"><h3>Mirando ${nombreMes(s.periodo)}</h3>

    if(r.cuentas && r.cuentas.length){

    if(r.categorias.length){

  }catch(e){ fallo(e); }

const cerradoIt = i => i.confirmado || i.omitido;
const ordenIt = (a,b) => (cerradoIt(a) - cerradoIt(b)) || (a.vence < b.vence ? -1 : 1);
function contarItems(lista){
  const hoy = S.ini.hoy;
  return {
    vencidos: lista.filter(i => !cerradoIt(i) && i.vence < hoy).length,
    porVencer: lista.filter(i => !cerradoIt(i) && i.vence >= hoy).length,
    listos: lista.filter(i => i.confirmado).length,
    proximo: lista.filter(i => !cerradoIt(i)).sort(ordenIt)[0]
  };
}
/** Cuadro resumen tocable (A pagar / Ingresos esperados). */
function cuadroItems(lista, sentido, total){
  const ing = sentido === 'ingreso', c = contarItems(lista);
  const destino = ing ? 'acobrar' : 'apagar';
  let h = `<button class="blk ${c.vencidos ? 'mal' : (c.vencidos + c.porVencer) ? 'pend' : 'ok'}" style="text-align:left;cursor:pointer;width:100%;font:inherit;color:inherit" onclick="ir('${destino}')">
    <div class="blk-top"><div><div class="n">${ing ? '💰 Ingresos esperados' : '🧾 A pagar'}</div><div class="s">${MESES[+S.periodo.slice(5,7)-1]} · tocá para ver el detalle</div></div>
    <div class="m ${ing ? 'pos' : (hay(total) ? 'neg' : '')}">${dos(total)}<div class="s">${ing ? 'falta cobrar' : 'falta pagar'}</div></div></div>
    <div class="mini-grid" style="grid-template-columns:repeat(3,1fr)">
      ${ing ? '' : `<div><span>Vencidos</span><b class="${c.vencidos ? 'neg' : ''}">${c.vencidos}</b></div>`}
      <div><span>${ing ? 'A cobrar' : 'Por vencer'}</span><b>${c.porVencer + (ing ? c.vencidos : 0)}</b></div>
      <div><span>${ing ? 'Cobrados' : 'Pagados'}</span><b class="pos">${c.listos}</b></div>
    </div>`;
  if(c.proximo) h += `<div class="s" style="margin-top:10px">Próximo: <b>${esc(c.proximo.nombre)}</b> · ${fechaCorta(c.proximo.vence)} · ${linea(c.proximo.parcial ? c.proximo.falta : c.proximo.ref)}</div>`;
  else if(lista.length) h += `<div class="s" style="margin-top:10px">${ing ? 'Todo cobrado este mes 👍' : 'Todo pagado este mes 👍'}</div>`;
  else h += `<div class="s" style="margin-top:10px">${ing ? 'No hay ingresos esperados.' : 'No hay vencimientos. Cargá gastos fijos, tarjetas o créditos desde el Menú.'}</div>`;
  return h + `</button>`;
}
/** Detalle: A pagar (egresos) o Ingresos esperados. */
async function vDetalleItems(sentido){
  try{
    const ing = sentido === 'ingreso', vista = ing ? 'vACobrar' : 'vAPagar';
    const r = (await datosMes(S.periodo)).resumen;
    S.items = r.egresos.concat(r.ingresos);
    const lista = ing ? r.ingresos : r.egresos;
    const m = r.mes, c = contarItems(lista);
    S.filtroItems = S.filtroItems || 'pend';
    const filtros = [['pend', ing ? 'A cobrar' : 'Pendientes'], ['listos', ing ? 'Cobrados' : 'Pagados'], ['todos', 'Todos']];
    const ver = lista.filter(i => S.filtroItems === 'todos' ? true : S.filtroItems === 'pend' ? !cerradoIt(i) : cerradoIt(i)).sort(ordenIt);
    let h = volver() + barraMes(vista);
    h += `<div class="kpis" style="margin-bottom:12px">
      <div class="kpi"><span>${ing ? 'Falta cobrar' : 'Falta pagar'}</span><b class="${ing ? 'pos' : 'neg'}">${dos(ing ? (m.ingresos ? m.ingresos.aCobrar : null) : m.egresos.aPagar)}</b></div>
      <div class="kpi"><span>${ing ? 'Ya cobrado' : 'Ya pagado'}</span><b class="pos">${dos(ing ? (m.ingresos ? m.ingresos.cobrado : null) : m.egresos.pagado)}</b></div>
      ${ing ? '' : `<div class="kpi"><span>Vencidos</span><b class="${c.vencidos ? 'neg' : ''}">${c.vencidos}</b></div>`}
      <div class="kpi"><span>${ing ? 'A cobrar' : 'Por vencer'}</span><b>${c.porVencer + (ing ? c.vencidos : 0)}</b></div></div>`;
    h += `<div class="opciones" style="margin-bottom:12px">${filtros.map(f => `<button class="${S.filtroItems===f[0]?'on':''}" onclick="S.filtroItems='${f[0]}';${vista}()">${f[1]}</button>`).join('')}</div>`;
    if(!ver.length) h += `<div class="card vacio">${S.filtroItems==='pend' ? (ing ? 'No queda nada por cobrar este mes.' : 'No queda nada por pagar este mes. 👍') : 'No hay ítems para mostrar.'}</div>`;
    h += `<div class="grid2">${ver.map(it => bloqueItem(it, S.items.indexOf(it))).join('')}</div>`;
    $('app').innerHTML = h;
  }catch(e){ fallo(e); }
}
function vAPagar(){ return vDetalleItems('egreso'); }
function vACobrar(){ return vDetalleItems('ingreso'); }
function rerender(){ ir(S.tab, true); }

function bloqueItem(it, idx){
  const esIng = it.tipo === 'Ingreso';
  let chip, clase;
  if(it.confirmado){
    clase = 'ok';
    if(it.previo) chip = `<span class="chip ok">Pagado antes de usar la app</span>`;
    else if(hay(it.arrastreOut)) chip = `<span class="chip ok">Pagado ${linea(it.real)} · el resto (${linea(it.arrastreOut)}) pasó a ${MESES[+sumarMeses(it.periodo,1).slice(5,7)-1]}</span>`;
    else chip = `<span class="chip ok">${esIng?'Cobrado':'Pagado'} · ${esc(it.pagadoPor)}${it.fechaPago?' el '+fechaCorta(it.fechaPago):''}</span>`;
  } else if(it.omitido){ clase='gris'; chip = `<span class="chip gris">${esIng?'No se cobra':'No se paga'} este mes</span>`; }
  else if(it.parcial){ clase='pend'; chip = `<span class="chip pend">Pago parcial ${linea(it.real)} · resta ${linea(it.falta)}</span>`; }
  else if(it.vence < S.ini.hoy){ clase='mal'; chip = `<span class="chip mal">Vencido</span>`; }
  else { clase='pend'; chip = `<span class="chip pend">${esIng?'A cobrar':'Pendiente'}</span>`; }

  const sub = [TIPO_TXT[it.tipo] + (it.recurrente?' mensual':''), it.cuota ? 'cuota '+it.cuota : '', it.responsable, (esIng?'':'vence ')+fechaCorta(it.vence)].filter(Boolean).map(esc).join(' · ');
  let monto, nota = '';
  if(it.confirmado){ monto = dos(it.real); if(!it.previo && !hay(it.arrastreOut) && (it.real.ARS!==it.ref.ARS || it.real.USD!==it.ref.USD)) nota = `<div class="s">estimado ${linea(it.ref)}</div>`; }
  else if(it.omitido) monto = `<span class="s" style="text-decoration:line-through">${dos(it.ref)}</span>`;
  else if(it.parcial){ monto = dos(it.falta); nota = `<div class="estim">resta pagar</div>`; }
  else { monto = dos(it.ref); nota = `<div class="estim">${it.ajustado?'estimado ajustado':'estimado'}</div>`; }

  const b = [];
  if(!it.confirmado && !it.omitido){
    b.push(`<button class="btn" onclick="confirmar(${idx})">${esIng?'Cobrado':it.parcial?'Pagar resto':'Pagar'}</button>`);
    b.push(`<button class="btn sec" onclick="ajustar(${idx})">Ajustar</button>`);
    if(it.parcial && it.tipo==='Tarjeta') b.push(`<button class="btn sec" onclick="arrastrar(${idx})">Resto al mes que viene</button>`);
    if(!it.parcial && it.puedeOmitir) b.push(`<button class="btn gris" onclick="omitir(${idx})">No ${esIng?'cobro':'pago'}</button>`);
  }
  if(it.conPagos) b.push(`<button class="btn gris" onclick="deshacer(${idx},'confirmacion')">Deshacer ${it.parcial||hay(it.arrastreOut)?'pagos':esIng?'cobro':'pago'}</button>`);
  if(it.omitido) b.push(`<button class="btn gris" onclick="deshacer(${idx},'omision')">Deshacer</button>`);
  if(it.detalle && it.detalle.length) b.push(`<button class="btn gris" onclick="var d=$('det${idx}');d.style.display=d.style.display==='none'?'block':'none'">Detalle (${it.detalle.length})</button>`);

  return `<div class="blk ${clase}">
    <div class="blk-top"><div style="min-width:0"><div class="n">${esc(it.nombre)}</div><div class="s">${sub}</div></div><div class="m">${monto}${nota}</div></div>
    ${chip}
    ${it.detalle && it.detalle.length ? `<div id="det${idx}" class="det" style="display:none">${it.detalle.map(d=>`<div><span>${esc(d.descripcion)} <span class="s">${esc(d.cuota)}</span></span><span>${plata(d.monto,d.moneda)}</span></div>`).join('')}</div>`:''}
    ${b.length?`<div class="blk-acc">${b.join('')}</div>`:''}</div>`;
}

function monedasItem(it){
  if(it.tipo === 'Tarjeta') return (it.ref.USD > 0 || (it.falta && it.falta.USD > 0)) ? ['ARS','USD'] : ['ARS'];
  return [it.moneda === 'USD' ? 'USD' : 'ARS'];
}
function confirmar(idx){
  const it = S.items[idx], esIng = it.tipo==='Ingreso', mons = monedasItem(it);
  const base = it.parcial ? it.falta : it.ref;
  let h = `<h3 style="margin-top:0">${esIng?'Confirmar cobro':it.parcial?'Pagar el resto':'Confirmar pago'}</h3>
    <div class="s">${esc(it.nombre)} · ${nombreMes(it.periodo)} · ${it.parcial?'resta '+linea(it.falta):'estimado '+linea(it.ref)}</div>`;
  if(!esIng) h += `<label>¿Cuánto pagaste?</label><div class="opciones" id="cForma">
      <button class="on" data-f="Total" onclick="formaPago(this)">${it.parcial?'Todo lo que resta':'El total'}</button>
      <button data-f="Parcial" onclick="formaPago(this)">${it.tipo==='Tarjeta'?'Una parte (mínimo, parcial)':'Una parte'}</button></div>`;
  mons.forEach(mn => {
    h += `<div class="${mons.length>1?'mrow':''}">${mons.length>1?`<label style="font-weight:600;color:var(--txt)">En ${mn==='USD'?'dólares':'pesos'}</label>`:''}

    <label>Fecha</label><input id="cFecha" type="date" value="${S.ini.hoy}">

function formaPago(btn){

}
function ajustar(idx){

async function arrastrar(idx){
  const it = S.items[idx];
  if(!confirm(`¿Pasar ${linea(it.falta)} al resumen de ${nombreMes(sumarMeses(it.periodo,1))}? Este resumen queda cerrado.`)) return;

}
async function omitir(idx){
  const it = S.items[idx];

}
async function deshacer(idx, que){

// ---------- FORMULARIO DE GASTO (cargar y editar) ----------
function htmlGasto(m){
  const I = S.ini; m = m || {};
  const medio = m.medio || (I.tarjetas.length ? 'Tarjeta' : I.medios[0]);
  const pagado = m.estado !== 'Pendiente';
  return `<label>Descripción</label><input id="fDesc" value="${esc(m.descripcion||'')}" placeholder="Ej: Supermercado, zapatillas, plomero">
    <label>Medio de pago</label><div class="opciones">${I.medios.map(x=>`<button type="button" data-v="${esc(x)}" class="${x===medio?'on':''}" onclick="elegirMedio(this)">${esc(x)}</button>`).join('')}</div>
    <input type="hidden" id="fMedio" value="${esc(medio)}">
    <div class="dos"><div><label id="fMontoL">Monto</label><input id="fMonto" inputmode="decimal" placeholder="0" value="${m.monto||''}" oninput="syncCuota('total')"></div>
    <div><label>Moneda</label><select id="fMon" onchange="ctaGasto();previa()">${opciones(['ARS','USD'], m.moneda||'ARS')}</select></div></div>
    <div id="bloqueTj">
      <div class="dos"><div><label>Tarjeta</label><select id="fTj" onchange="previa()">${opcTarjetas(m.tarjeta_id)}</select></div>
      <div><label>Cuotas</label><input id="fCuotas" type="number" min="1" value="${m.cuotas||1}" oninput="syncCuota('total')"></div></div>
      <div class="dos"><div><label>Valor de cada cuota</label><input id="fValCuota" inputmode="decimal" placeholder="0" oninput="syncCuota('cuota')"></div>
      <div><label>Precio de contado</label><input id="fContado" inputmode="decimal" placeholder="Opcional" value="${m.precio_contado||''}" oninput="previa()"></div></div>
      <div id="previa" class="nota" style="display:none"></div>
    </div>
    <div id="bloqueNoTj">
      <div class="checks"><label><input type="checkbox" id="fPagado" ${pagado?'checked':''} onchange="pagadoCambio()"> Ya está pagado</label></div>
      <div id="bloqueCta">${hayCuentas() ? `<label>¿De qué cuenta salió?</label><select id="fCta"></select>` : ''}</div>
      <div id="notaPend" class="nota" style="display:none">Queda como <b>pendiente</b> en Inicio con este monto estimado. No se descuenta de ninguna cuenta hasta que confirmes el pago.</div>
    </div>
    <div class="dos"><div><label id="fFechaL">Fecha</label><input id="fFecha" type="date" value="${esc(String(m.fecha||I.hoy).slice(0,10))}" onchange="previa()"></div>
    <div><label>Categoría</label><select id="fCat">${opciones(I.categoriasGasto, m.categoria)}</select></div></div>
    <div class="dos"><div><label>¿Quién?</label><select id="fQuien">${opciones(I.personas, m.quien||I.usuario.nombre)}</select></div>
    <div><label>Notas</label><input id="fNotas" value="${esc(m.notas||'')}" placeholder="Opcional"></div></div>`;
}
function initGasto(m){ S._ctaPref = m && m.cuenta_id; medioCambio(); syncCuota('total'); }
function datosGasto(){
  return {descripcion:$('fDesc').value, monto:$('fMonto').value, moneda:$('fMon').value, fecha:$('fFecha').value,
    categoria:$('fCat').value, medio:$('fMedio').value, tarjeta_id:$('fTj').value, cuotas:$('fCuotas').value, precio_contado:$('fContado').value,
    pagado:$('fPagado').checked, quien:$('fQuien').value, notas:$('fNotas').value, cuenta_id: $('fCta') ? $('fCta').value : ''};
}
function elegirMedio(btn){ btn.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b===btn)); $('fMedio').value = btn.dataset.v; medioCambio(); }
function medioCambio(){
  const t = $('fMedio').value==='Tarjeta';
  $('bloqueTj').style.display = t?'block':'none';
  $('bloqueNoTj').style.display = t?'none':'block';
  $('fMontoL').textContent = t ? 'Total en cuotas' : 'Monto';
  pagadoCambio(); ctaGasto(); previa();
}
function pagadoCambio(){
  const t = $('fMedio').value==='Tarjeta', pag = $('fPagado').checked;
  $('bloqueCta').style.display = (!t && pag) ? 'block' : 'none';
  $('notaPend').style.display = (!t && !pag) ? 'block' : 'none';
  $('fFechaL').textContent = (!t && !pag) ? 'Vence el' : 'Fecha';
}
function ctaGasto(){ if(!$('fCta')) return; const m=$('fMon').value;
  $('fCta').innerHTML = opcCuentas(m, S._ctaPref ? cuentaDefault(m, S._ctaPref) : ($('fMedio').value==='Efectivo' ? '' : cuentaDefault(m)), true); }
function syncCuota(desde){
  if(!$('fCuotas')) return;
  const n = Math.max(1, parseInt($('fCuotas').value)||1);
  if(desde==='cuota'){ const v = numF($('fValCuota').value); setNum($('fMonto'), v ? Math.round(v*n*100)/100 : ''); }
  else { const t = numF($('fMonto').value); setNum($('fValCuota'), t ? Math.round(t/n*100)/100 : ''); }
  previa();
}
function previa(){
  const p = $('previa'); if(!p) return;
  const t = S.ini.tarjetas.find(x => x.id === $('fTj').value);
  const f = $('fFecha').value, n = Math.max(1, parseInt($('fCuotas').value)||1), m = numF($('fMonto').value), c = numF($('fContado').value), mon = $('fMon').value;
  if(!t || !f || $('fMedio').value!=='Tarjeta'){ p.style.display='none'; return; }
  const d = +f.slice(8,10); let pc = f.slice(0,7); if(d > +t.dia_cierre) pc = sumarMeses(pc,1);
  const pp = +t.dia_vencimiento > +t.dia_cierre ? pc : sumarMeses(pc,1);
  let txt = `Primera cuota en el resumen que vence en <b>${nombreMes(pp)}</b>` + (n>1 ? `, última en <b>${nombreMes(sumarMeses(pp,n-1))}</b>.` : '.');
  if(m && n>1) txt += ` ${n} × ${plata(m/n, mon)}.`;
  if(m && c && m > c) txt += `<br>Interés: <b>${plata(m-c, mon)}</b> (${Math.round((m-c)/c*1000)/10}% sobre el contado).`;
  p.style.display='block'; p.innerHTML = txt;
}

// ---------- CARGAR ----------
function vCargar(){
  S._trfCuentas = null;
  const I = S.ini;
  const tipos = [['gasto','💸 Gasto']].concat(puede('ingresos')?[['ingreso','💰 Ingreso']]:[]).concat(puede('cuentas')?[['transferencia','🔄 Entre cuentas']]:[]);
  if(!tipos.some(t=>t[0]===S.tipoCarga)) S.tipoCarga='gasto';
  let h = tipos.length>1 ? `<div class="opciones" style="margin-bottom:12px">${tipos.map(t=>`<button class="${S.tipoCarga===t[0]?'on':''}" onclick="S.tipoCarga='${t[0]}';vCargar()">${t[1]}</button>`).join('')}</div>` : '';
  h += `<div class="card">`;
  if(S.tipoCarga==='transferencia'){
    const cs = I.cuentas||[];
    if(cs.length < 2){ $('app').innerHTML = h + `<div class="vacio">Necesitás al menos dos cuentas cargadas. Agregalas en Menú › Cuentas.</div></div>`; return; }
    const d0 = cuentaDefault('ARS') || cs[0].id;
    const op = sel => cs.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nombre)} · ${esc(c.titular)} (${c.moneda})</option>`).join('');
    h += `<label>Desde</label><select id="tDesde" onchange="trfMon()">${op(d0)}</select>
      <label>Hacia</label><select id="tHacia" onchange="trfMon()">${op((cs.find(c=>c.id!==d0)||{}).id)}</select>
      <div class="dos"><div><label id="tMontoL">Monto</label><input id="tMonto" inputmode="decimal" placeholder="0"></div>
      <div><label>Fecha</label><input id="tFecha" type="date" value="${I.hoy}"></div></div>
      <div id="tDestB" style="display:none"><label id="tDestL">Monto que llegó</label><input id="tDest" inputmode="decimal" placeholder="0"><div id="tTc" class="s" style="margin-top:4px"></div></div>
      <label>Notas</label><input id="tNotas" placeholder="Opcional">
      <button class="btn full" id="tOk" style="margin-top:16px" onclick="guardarTrf()">Guardar transferencia</button>
      <div class="nota">Las transferencias entre cuentas propias no cuentan como gasto: solo mueven saldo. Sirve también para compra o venta de dólares.</div></div>`;
    $('app').innerHTML = h; trfMon(); return;
  }
  if(S.tipoCarga==='gasto'){
    h += htmlGasto() + `<button class="btn full" id="fOk" style="margin-top:16px" onclick="guardarGasto()">Guardar gasto</button>
      <div class="nota">Los resúmenes de tarjeta, las cuotas de créditos y los gastos fijos no se cargan acá: aparecen solos en Inicio para confirmarlos.</div></div>`;
    $('app').innerHTML = h; initGasto(); return;
  }
  h += htmlIngreso() + `<button class="btn full" id="iOk" style="margin-top:16px" onclick="guardarIng()">Guardar ingreso</button></div>`;
  $('app').innerHTML = h; initIngreso();
}
async function guardarGasto(){
  const b=$('fOk'); ocupar(b);

  catch(e){ liberar(b); toast(errorMsg(e)); }
}
async function guardarIng(){

function trfMon(){
  const cs = (S._trfCuentas || []).concat(S.ini.cuentas), a = cs.find(c=>c.id===$('tDesde').value), b = cs.find(c=>c.id===$('tHacia').value);

    const calc = () => { const x=numF($('tMonto').value), y=numF($('tDest').value);
      $('tTc').textContent = x&&y ? 'Tipo de cambio: ' + plata(a.moneda==='ARS'? x/y : y/x,'ARS') : ''; };

async function guardarTrf(){

function editarGasto(i, desde){

function sugerirPrevias(aplicar){
  const f = $('cPri').value; if(!f) return;
  const hoy = S.ini.hoy.slice(0,7), p = f.slice(0,7);
  const n = Math.max(0, (+hoy.slice(0,4) - +p.slice(0,4))*12 + (+hoy.slice(5,7) - +p.slice(5,7)));
  const N = parseInt($('cN').value)||0, v = N ? Math.min(n, N) : n;
  $('cPrevTxt').textContent = `Vencieron ${v} cuota(s) antes de ${nombreMes(hoy)}.` + (aplicar ? '' : ' Tocá "Calcular" para usar ese número.');
  if(aplicar) $('cPrev').value = v;
}

        <div class="m ${c.saldo<0?'neg':''}">${plata(c.saldo,c.moneda)}</div></div>
        <div id="ext${i}" style="display:none;margin-top:8px">${c.movimientos.length ? c.movimientos.map(m => `<div class="fila"><div><div>${esc(m.detalle)}</div><div class="s">${fechaCorta(m.fecha)} · ${esc(m.tipo)} · ${esc(m.quien||'')}</div></div>
          <div class="der"><div class="${m.monto<0?'neg':'pos'}">${m.monto>0?'+':''}${plata(m.monto,c.moneda)}</div><div class="s">saldo ${plata(m.saldo,c.moneda)}</div>
          ${m.trf_id?`<div style="display:flex;gap:4px;justify-content:flex-end;margin-top:4px"><button class="btn sec" style="padding:5px 9px;font-size:12px" onclick="editarTrf('${m.trf_id}')">Editar</button><button class="btn peligro" style="padding:5px 9px;font-size:12px" onclick="borrarTrf('${m.trf_id}')">Borrar</button></div>`:''}</div></div>`).join('') : '<div class="vacio">Sin movimientos desde el saldo inicial.</div>'}</div>
        <div class="blk-acc"><button class="btn sec" onclick="var d=$('ext${i}');d.style.display=d.style.display==='none'?'block':'none'">Movimientos</button>
          ${c.puedeEditar?`<button class="btn gris" onclick="formCuenta(S._ctas[${i}])">Editar</button>`:''}</div></div>`).join('') + `</div>`;
    h += `<div class="nota">Saldo = saldo inicial + ingresos cobrados − gastos pagados ± transferencias, de todo lo asociado a la cuenta. Lo estimado o pendiente no mueve las cuentas. Si no coincide con el banco, editá la cuenta y poné el saldo real.</div>`;
    $('app').innerHTML = h;
  }catch(e){ fallo(e); }
}
function formCuenta(c){
  c = c || {};
  abrirModal(`<h3 style="margin-top:0">${c.id?'Editar':'Nueva'} cuenta</h3>
    <label>Nombre</label><input id="kNom" value="${esc(c.nombre||'')}" placeholder="Ej: Caja de ahorro Macro, Mercado Pago, Efectivo">
    <div class="dos"><div><label>Banco / billetera</label><input id="kBan" value="${esc(c.banco||'')}"></div>
    <div><label>Titular</label><select id="kTit">${opciones(S.ini.personas, c.titular||S.ini.usuario.nombre)}</select></div></div>
    <div class="dos"><div><label>Moneda</label><select id="kMon">${opciones(['ARS','USD'], c.moneda||'ARS')}</select></div>
    <div><label>Saldo actual</label><input id="kSal" inputmode="decimal" value="${c.saldo_inicial ?? ''}" placeholder="0"></div></div>
    <label>Fecha del saldo</label><input id="kFec" type="date" value="${esc(c.fecha_saldo||S.ini.hoy)}">
    ${c.id ? `<div class="checks"><label><input type="checkbox" id="kAct" ${c.activa!=='NO'?'checked':''}> Activa</label></div>`:''}
    <div class="nota">Poné el saldo que ves ahora en el banco. Todo lo que cargues a partir de este momento se suma o resta.</div>${botonesModal('kOk')}`);
  $('kOk').onclick = async () => { ocupar($('kOk'));
    try{ await accion('guardarCuenta', [{id:c.id, nombre:$('kNom').value, banco:$('kBan').value, titular:$('kTit').value, moneda:$('kMon').value,
        saldo_inicial:$('kSal').value, fecha_saldo:$('kFec').value, activa: $('kAct') ? $('kAct').checked : true}]);
      cerrarModal(); toast('Cuenta guardada'); vCuentas(); }
    catch(e){ liberar($('kOk')); toast(errorMsg(e)); } };
}
function editarTrf(id){
  const t = (S.data.transferencias || []).find(x => x.id === id);
  if(!t){ toast('No se encontró la transferencia'); return; }
  if(t.puedeEditar === false){ toast('Solo puede editarla quien la cargó o un admin'); return; }
  const cs = S.data.cuentas || [];
  const op = sel => cs.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.nombre)} · ${esc(c.titular)} (${c.moneda})</option>`).join('');
  abrirModal(`<h3 style="margin-top:0">Editar transferencia</h3>
    <label>Desde</label><select id="tDesde" onchange="trfMon()">${op(t.desde_id)}</select>
    <label>Hacia</label><select id="tHacia" onchange="trfMon()">${op(t.hacia_id)}</select>
    <div class="dos"><div><label id="tMontoL">Monto</label><input id="tMonto" inputmode="decimal" value="${t.monto}"></div>
    <div><label>Fecha</label><input id="tFecha" type="date" value="${esc(String(t.fecha).slice(0,10))}"></div></div>
    <div id="tDestB" style="display:none"><label id="tDestL">Monto que llegó</label><input id="tDest" inputmode="decimal" value="${t.monto_destino||''}"><div id="tTc" class="s" style="margin-top:4px"></div></div>
    <label>Notas</label><input id="tNotas" value="${esc(t.notas||'')}" placeholder="Opcional">
    ${botonesModal('tOk')}`);
  S._trfCuentas = cs; trfMon();
  $('tOk').onclick = async () => { ocupar($('tOk'));
    try{ await accion('editarTransferencia', [{id:t.id, desde_id:$('tDesde').value, hacia_id:$('tHacia').value, monto:$('tMonto').value, monto_destino:$('tDest').value, fecha:$('tFecha').value, notas:$('tNotas').value}]);
      cerrarModal(); toast('Transferencia actualizada'); rerender(); }
    catch(e){ liberar($('tOk')); toast(errorMsg(e)); } };
}
async function borrarTrf(id){ if(!confirm('¿Borrar esta transferencia? Se borra de las dos cuentas.')) return;
  try{ await accion('borrarTransferencia', [id]); toast('Borrada'); rerender(); }catch(e){ toast(errorMsg(e)); } }

// ---------- FLUJO ----------
async function vFlujo(){
  try{
    const fs = S.data.flujo || [];
    const cot = S.ini.cotizacion, conIng = fs[0] && fs[0].ingresos, conCr = puede('creditos');
    let acum = 0;
    let h = volver() + `<div class="nota" style="margin:0 0 12px">Estimado mes a mes: lo confirmado con el monto real, lo demás con el estimado. "Otros" son gastos sueltos, que solo aparecen cuando se cargan.${cot?` Acumulado en pesos con dólar ${esc(S.ini.cotizacionTipo)} a ${plata(cot,'ARS')}.`:''}</div><div class="grid2">`;
    fs.forEach(r => {
      if(conIng) acum += equiv(r.saldo);
      const T = r.porTipo;
      h += `<div class="blk ${conIng ? (equiv(r.saldo)<0?'mal':'ok') : ''}">
        <div class="blk-top"><div class="n" style="text-transform:capitalize">${nombreMes(r.periodo)}</div>${conIng?`<div class="m ${equiv(r.saldo)<0?'neg':'pos'}">${dos(r.saldo)}<div class="s">saldo del mes</div></div>`:''}</div>
        <div class="mini-grid">
          ${conIng?`<div><span>Ingresos</span><b>${dos(r.ingresos.previsto)}</b></div>`:''}
          <div><span>Gastos</span><b>${dos(r.egresos.estimado)}</b></div>
          <div><span>Tarjetas</span><b>${dos(T.Tarjeta)}</b></div>
          ${conCr?`<div><span>Créditos</span><b>${dos(T.Credito)}</b></div>`:''}
          <div><span>Fijos y débitos</span><b>${dos(T.Fijo)}</b></div>
          <div><span>Otros</span><b>${dos(T.Gasto)}</b></div>
        </div>
        ${conIng && cot ? `<div class="s" style="margin-top:8px">Acumulado ≈ <b class="${acum<0?'neg':'pos'}">${plata(acum,'ARS')}</b></div>` : ''}</div>`;
    });
    h += `</div>`;
    $('app').innerHTML = h;
  }catch(e){ fallo(e); }
}

// ---------- USUARIOS ----------
const NOMBRE_MOD = {inicio:'Inicio (resumen y vencimientos)', cargar:'Cargar gastos', movimientos:'Ver movimientos', ingresos:'Ingresos', fijos:'Gastos fijos', tarjetas:'Tarjetas', creditos:'Créditos', cuentas:'Cuentas bancarias', flujo:'Flujo de fondos', usuarios:'Usuarios', config:'Configuración'};
async function vUsuarios(){
  try{
    const r = S.data.usuarios || {usuarios:[], modulos:[]};
    S._mods = r.modulos; S._usrs = r.usuarios;
    let h = volver() + `<button class="btn full" style="margin-bottom:12px" onclick="formUsuario()">+ Agregar usuario</button><div class="grid2">`;
    r.usuarios.forEach((u,i) => h += `<div class="blk ${u.activo==='NO'?'gris':''}"><div class="blk-top"><div style="min-width:0"><div class="n">${esc(u.nombre)}</div><div class="s">${esc(u.email)}</div></div>
      <div>${u.rol==='admin'?'<span class="chip" style="margin:0">Admin</span>':''}</div></div>
      <div class="s" style="margin-top:6px">${u.rol==='admin'?'Ve todo':esc(String(u.permisos).split(',').filter(Boolean).map(p=>NOMBRE_MOD[p]||p).join(', '))}</div>
      <div class="s">Alta por ${esc(u.creado_por)} el ${esc(String(u.fecha_alta).slice(0,10))}</div>
      <div class="blk-acc"><button class="btn sec" onclick="formUsuario(S._usrs[${i}])">Editar</button></div></div>`);
    h += `</div><div class="nota">Para que alguien entre: dalo de alta acá con su mail de Google y mandale el link de la app. No hace falta compartir la planilla.</div>`;
    $('app').innerHTML = h;
  }catch(e){ fallo(e); }
}
function formUsuario(u){
  u = u || {rol:'miembro', permisos:'inicio,cargar,movimientos'};
  const p = String(u.permisos||'').split(',');
  abrirModal(`<h3 style="margin-top:0">${u.email?'Editar':'Nuevo'} usuario</h3>
    <label>Email (cuenta de Google)</label><input id="uEm" value="${esc(u.email||'')}" ${u.email?'disabled':''}>
    <label>Nombre</label><input id="uNom" value="${esc(u.nombre||'')}">
    <label>Rol</label><select id="uRol" onchange="$('uPerm').style.display=this.value==='admin'?'none':'block'">${['miembro','admin'].map(r=>`<option ${r===u.rol?'selected':''}>${r}</option>`).join('')}</select>
    <div id="uPerm" class="checks" style="display:${u.rol==='admin'?'none':'block'}"><label style="background:none;padding:0;color:var(--sub)">Qué puede ver y hacer:</label>
      ${S._mods.map(m=>`<label><input type="checkbox" class="uMod" value="${m}" ${p.indexOf(m)>=0?'checked':''}> ${NOMBRE_MOD[m]||m}</label>`).join('')}</div>
    ${u.email?`<div class="checks"><label><input type="checkbox" id="uAct" ${u.activo!=='NO'?'checked':''}> Activo</label></div>`:''}
    ${botonesModal('uOk')}`);
  $('uOk').onclick = async () => { ocupar($('uOk'));
    try{ const r = await accion('guardarUsuario', [{email:$('uEm').value, nombre:$('uNom').value, rol:$('uRol').value,
        permisos:[...document.querySelectorAll('.uMod:checked')].map(x=>x.value), activo: $('uAct') ? $('uAct').checked : true}]);
      cerrarModal(); toast(r.recordatorio || 'Usuario guardado'); vUsuarios(); }
    catch(e){ liberar($('uOk')); toast(errorMsg(e)); } };
}

// ---------- CONFIG ----------
async function vConfig(){
  try{
    const cfg = S.data.config || [];
    let h = volver() + `<div class="card"><h3>Dólar</h3><div class="fila"><div>Cotización actual</div><div class="der t">${plata(S.ini.cotizacion,'ARS')}</div></div>
      <button class="btn sec full" style="margin-top:8px" onclick="actCot(this)">Actualizar cotización ahora</button></div><div class="card"><h3>Ajustes</h3>`;
    cfg.forEach(c => h += `<label>${esc(c.descripcion||c.clave)}</label><div style="display:flex;gap:6px"><input id="cfg_${esc(c.clave)}" value="${esc(c.valor)}"><button class="btn" onclick="guardaCfg('${esc(c.clave)}')">OK</button></div>`);
    h += `</div>`;
    $('app').innerHTML = h;
  }catch(e){ fallo(e); }
}
async function guardaCfg(k){ try{ await accion('guardarConfig', [k, $('cfg_'+k).value]); toast('Guardado'); $('hogar').textContent=S.ini.hogar; vConfig(); }catch(e){ toast(errorMsg(e)); } }
async function actCot(b){ ocupar(b); try{ const r = await accion('actualizarCotizacion', []); toast(r.manual?'Está en modo manual':'Cotización: '+plata(r.valor,'ARS')); vConfig(); }catch(e){ liberar(b); toast(errorMsg(e)); } }

iniciar();
</script>
</body>
</html>
